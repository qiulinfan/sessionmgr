name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Validate the release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            release_version="${BASH_REMATCH[1]}"
          else
            echo "Release tag must use vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if ! grep -Fq "var version = \"$release_version-dev\"" internal/app/app.go &&
             ! grep -Fq "var version = \"$release_version\"" internal/app/app.go; then
            echo "Source version does not match release tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

          devlog="docs/devlogs/v$release_version.md"
          if [[ ! -f "$devlog" ]] || ! grep -Fxq "> Status: Released" "$devlog"; then
            echo "$devlog must exist and be marked Released before tagging" >&2
            exit 1
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Verify dependencies
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Test with the race detector
        run: go test -race ./...

  build:
    name: Build Windows executables
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Build and verify Windows release assets
        shell: pwsh
        run: .\scripts\build-windows-release.ps1 -Version '${{ needs.validate.outputs.release_version }}'

      - name: Stage validated release assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-assets
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the tag release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@v8
        with:
          name: windows-release-assets
          path: dist

      - name: Reverify downloaded checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          release_version="${RELEASE_VERSION#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Session Manager $release_version" \
            --notes "Portable icon-bearing Windows executables are attached for AMD64 and ARM64, together with SHA256SUMS.txt. These binaries are not Authenticode-signed, so Windows SmartScreen may show a warning."
