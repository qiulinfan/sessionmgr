name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate and build Windows executables
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Validate the release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            release_version="${BASH_REMATCH[1]}"
          else
            echo "Release tag must use vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if ! grep -Fq "var version = \"$release_version-dev\"" internal/app/app.go &&
             ! grep -Fq "var version = \"$release_version\"" internal/app/app.go; then
            echo "Source version does not match release tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

          devlog="docs/devlogs/v$release_version.md"
          if [[ ! -f "$devlog" ]] || ! grep -Fxq "> Status: Released" "$devlog"; then
            echo "$devlog must exist and be marked Released before tagging" >&2
            exit 1
          fi

          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Verify dependencies
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Test with the race detector
        run: go test -race ./...

      - name: Build Windows release assets
        shell: bash
        run: |
          mkdir -p dist
          resource_prefix="cmd/sessionmgr/rsrc"
          resource_files=(
            "${resource_prefix}_windows_amd64.syso"
            "${resource_prefix}_windows_arm64.syso"
          )
          for resource_file in "${resource_files[@]}"; do
            if [[ -e "$resource_file" ]]; then
              echo "Refusing to overwrite $resource_file" >&2
              exit 1
            fi
          done
          trap 'rm -f -- "${resource_files[@]}"' EXIT

          go run github.com/tc-hib/go-winres@v0.3.3 simply \
            --arch amd64,arm64 \
            --out "$resource_prefix" \
            --manifest cli \
            --product-version "$RELEASE_VERSION" \
            --file-version "$RELEASE_VERSION" \
            --file-description "Session Manager" \
            --product-name "Session Manager" \
            --original-filename "sessionmgr.exe" \
            --icon assets/sessionmgr.png
          for resource_file in "${resource_files[@]}"; do
            test -s "$resource_file"
          done

          linker_flags="-s -w -X github.com/sessionmgr/sessionmgr/internal/app.version=$RELEASE_VERSION"
          for architecture in amd64 arm64; do
            asset="dist/sessionmgr-v$RELEASE_VERSION-windows-$architecture.exe"
            CGO_ENABLED=0 GOOS=windows GOARCH="$architecture" \
              go build -trimpath -ldflags "$linker_flags" -o "$asset" ./cmd/sessionmgr
            magic="$(od -An -t x1 -N 2 "$asset" | tr -d ' \n')"
            if [[ "$magic" != "4d5a" ]]; then
              echo "$asset is not a Windows PE executable" >&2
              exit 1
            fi
            go version -m "$asset"
          done

          version_check="$RUNNER_TEMP/sessionmgr-version-check"
          CGO_ENABLED=0 go build -trimpath -ldflags "$linker_flags" -o "$version_check" ./cmd/sessionmgr
          [[ "$("$version_check" version)" == "sessionmgr $RELEASE_VERSION" ]]

          for architecture in amd64 arm64; do
            resource_check="$RUNNER_TEMP/sessionmgr-winres-$architecture"
            go run github.com/tc-hib/go-winres@v0.3.3 extract \
              --dir "$resource_check" \
              "dist/sessionmgr-v$RELEASE_VERSION-windows-$architecture.exe"
            test -s "$resource_check/#1_0000.ico"
            grep -Fq "\"ProductVersion\": \"$RELEASE_VERSION\"" "$resource_check/winres.json"
          done

          cd dist
          sha256sum *.exe > SHA256SUMS.txt

      - name: Stage validated release assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-assets
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the tag release
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@v8
        with:
          name: windows-release-assets
          path: dist

      - name: Reverify downloaded checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          release_version="${RELEASE_VERSION#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Session Manager $release_version" \
            --notes "Portable icon-bearing Windows executables are attached for AMD64 and ARM64, together with SHA256SUMS.txt. These binaries are not Authenticode-signed, so Windows SmartScreen may show a warning."
