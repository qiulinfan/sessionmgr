<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Manager</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">CODEX SESSION ARCHIVE</p>
          <h1>只保存这次发生的变化。</h1>
          <p class="lede">选择一个持久目录，将本机 Codex sessions 按 Git 远程仓库导出为 Markdown。</p>
        </div>
        <div id="connection" class="status-dot">正在连接</div>
      </header>

      <section class="panel settings">
        <div class="section-heading">
          <div>
            <p class="step">01</p>
            <h2>导出目录</h2>
          </div>
          <span id="save-status" class="muted"></span>
        </div>
        <div class="directory-row">
          <input id="directory" type="text" autocomplete="off" spellcheck="false" placeholder="例如 /Users/me/Documents/session-archive" />
          <button id="browse" class="button secondary" type="button">浏览</button>
          <button id="save" class="button secondary" type="button">保存</button>
        </div>
        <p class="hint">目录会保存在当前系统的 Session Manager 配置中，下次启动自动恢复。</p>
      </section>

      <section class="panel action-panel">
        <div class="section-heading">
          <div>
            <p class="step">02</p>
            <h2>导出 sessions</h2>
          </div>
          <select id="scope" aria-label="导出范围">
            <option value="all">全部 Git 仓库</option>
            <option value="current">当前 Git 仓库</option>
          </select>
        </div>
        <button id="export" class="button primary" type="button">导出变化</button>
      </section>

      <section class="results" aria-live="polite">
        <div class="section-heading">
          <div>
            <p class="step">03</p>
            <h2>本次导出变化</h2>
          </div>
          <span id="result-count" class="counter">—</span>
        </div>
        <div id="message" class="empty">尚未执行导出。</div>
        <div id="warnings" class="warnings hidden"></div>
        <div id="changes" class="change-list"></div>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
